initial_equity: 100000.0
cash_model: derivative
liquidate_at_end: true
log_level: INFO
log_format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_datefmt: "%Y-%m-%d %H:%M:%S"

rules:
  n_period: 20
  fast_entry: 20
  slow_entry: 55
  fast_exit: 10
  slow_exit: 20
  stop_n: 2.0
  pyramid_step_n: 0.5
  breakout_buffer_n: 0.0
  slow_entry_score_bonus: 0.25
