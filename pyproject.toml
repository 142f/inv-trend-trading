[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inv-trend-trading"
version = "0.2.1"
description = "Multi-asset Turtle trend-following research system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=15,<22",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "openpyxl>=3.1,<4",
  "duckdb>=1,<2",
]

[project.optional-dependencies]
okx = [
  "python-dotenv>=1,<2",
  "python-okx>=0.4.1,<0.5",
  "websockets>=12,<16",
]
mt5 = [
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]
test = [
  "coverage>=7,<8",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
turtle-data = "inv_trend.cli.data:main"
turtle-detect = "inv_trend.cli.detect:main"
turtle-alert = "inv_trend.cli.alert:main"
turtle-daily = "inv_trend.cli.daily:main"
turtle-backtest = "inv_trend.cli.backtest:main"
strategy-backtest = "inv_trend.cli.backtest:main"
market-data = "inv_trend.cli.market_data:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["inv_trend", "inv_trend.*"]
namespaces = false

[tool.setuptools.package-data]
"inv_trend.application.backtest" = ["*.css", "*.js"]
"inv_trend.config" = ["strategy.yaml"]
"inv_trend.data.config" = ["assets.yaml"]
"inv_trend.application.config" = ["strategy.yaml"]
"inv_trend.adapters.detector.config" = ["strategy.yaml"]
"inv_trend.adapters.detector.eligibility" = ["config/eligibility.yaml"]
"inv_trend.adapters.multi_asset.config" = ["defaults.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100
