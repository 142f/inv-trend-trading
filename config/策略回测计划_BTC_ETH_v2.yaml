schema_version: "2"
strategy_id: turtle
symbols: [BTC, ETH]

# 手续费与滑点固定来自 AssetSpec，不能作为同批次的搜索维度。
initial_equity: 100000.0
cash_model: derivative
liquidate_at_end: true
max_combinations: 1000

parameter_space:
  # 固定使用经典海龟 20/55 日入场；多头和空头均显式启用。
  turtle.rules.fast_entry: [20]
  turtle.rules.slow_entry: [55]
  turtle.rules.allow_short: [true]
  turtle.rules.stop_n: [1.5, 2.0]
  assets.BTC.unit_1n_risk_pct: [0.003]
  assets.BTC.can_long: [true]
  assets.BTC.can_short: [true]
  assets.ETH.unit_1n_risk_pct: [0.003]
  assets.ETH.can_long: [true]
  assets.ETH.can_short: [true]

constraints:
  - "rules.fast_entry < rules.slow_entry"

validation:
  # 加密资产 D1 连续交易：1460≈4 年，365≈1 年。
  train_bars: 1460
  validation_bars: 365
  step_bars: 365
  holdout_bars: 365
  min_folds: 3

ranking:
  min_oos_trades: 10
  max_drawdown: 0.40
  sharpe_weight: 0.35
  mar_weight: 0.25
  cagr_weight: 0.20
  stability_weight: 0.20
